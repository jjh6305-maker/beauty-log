<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauty Log</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff8fb;color:#29232a}.app{max-width:720px;margin:auto;padding:16px 16px 90px}h1{margin:4px 0}.muted{color:#777}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid #f0dce5;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #0000000a}button{border:0;background:#e91e63;color:#fff;padding:12px 14px;border-radius:12px;font-weight:800;font-size:15px}button.gray{background:#716b73}input,select,textarea{width:100%;padding:12px;margin:6px 0 10px;border:1px solid #ddd;border-radius:11px;font-size:16px}textarea{min-height:85px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:99}.bottom button{background:#fff;color:#555;border-radius:0;padding:9px 2px 8px;font-size:11px;line-height:1.25;min-height:52px}.bottom button.active{color:#e91e63;background:#fff1f6}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.preview img,.work img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.dday{font-size:42px;text-align:center;font-weight:900;color:#d81b60}.videoWrap{background:#111;border-radius:16px;min-height:235px;display:grid;place-items:center;overflow:hidden}.videoWrap video{width:100%;display:none;transform:scaleX(-1)}#camPlaceholder{color:#fff;text-align:center}.timer{font-size:42px;font-weight:900;text-align:center}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{flex:1}.status{padding:9px;background:#f7f3f5;border-radius:10px;margin-top:8px}.work{border-top:1px solid #eee;padding:12px 0}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compareBox{background:#f7f3f5;border-radius:14px;overflow:hidden;min-height:190px;display:grid;place-items:center;position:relative}.compareBox img{width:100%;height:100%;min-height:190px;object-fit:cover}.compareLabel{position:absolute;left:7px;top:7px;background:#ffffffdd;padding:5px 8px;border-radius:9px;font-size:12px;font-weight:800}.filePick{display:flex;gap:8px;margin:7px 0 10px}.filePick input{position:absolute;left:-9999px}.fileBtn{flex:1;display:flex;align-items:center;justify-content:center;background:#e91e63;color:#fff;padding:10px;border-radius:11px;font-size:13px;font-weight:800}.fileClear{background:#777;padding:10px 11px;font-size:12px}.previewItem{position:relative}.imgDelete{position:absolute;right:4px;top:4px;width:26px;height:26px;padding:0;border-radius:50%;background:#222c}</style></head><body><div class="app"><header><h1>Beauty Log ✂️</h1><div class="muted">서경대 미용입시 연습 포트폴리오</div></header><section id="home" class="page active"><div class="card"><h2>🎓 서경대 입시 카운트다운</h2><div id="homeDday" class="dday">시험일 입력</div><input id="homeExam" type="date"><button id="homeSaveExam">저장</button></div><div class="card"><h2>오늘도 한 작품씩 💗</h2><button data-go="practice">오늘 연습 기록하기</button></div></section><section id="practice" class="page"><div class="card"><h2>✂️ 오늘의 연습</h2><select id="type"><option>커트</option><option>펌</option><option>업스타일</option><option>염색</option><option>기타</option></select><input id="minutes" type="number" placeholder="연습시간(분)"><textarea id="good" placeholder="잘된 점"></textarea><textarea id="improve" placeholder="보완할 점"></textarea><div class="filePick"><label class="fileBtn" for="photos">파일 선택</label><button type="button" class="fileClear" data-clear="photos">삭제</button><input id="photos" type="file" accept="image/*" multiple></div><div id="photoCount">0 / 6장</div><div id="preview" class="preview"></div><button id="savePractice">연습 저장</button></div></section><section id="portfolio" class="page"><div class="card"><h2>🖼️ 포트폴리오</h2><select id="filterType"><option value="all">전체 종목</option><option>커트</option><option>펌</option><option>업스타일</option><option>염색</option><option>기타</option></select><select id="sort"><option value="new">최신순</option><option value="old">오래된순</option></select><div id="works"></div></div></section><section id="instagram" class="page"><div class="card"><h2>📸 인스타 올리기</h2><div class="filePick"><label class="fileBtn" for="instaPhotos">파일 선택</label><button class="fileClear" data-clear="instaPhotos">삭제</button><input id="instaPhotos" type="file" accept="image/*" multiple></div><div id="instaCount">0 / 6장</div><div id="instaPreview" class="preview"></div><select id="instaType"><option>커트</option><option>펌</option><option>업스타일</option><option>염색</option></select><input id="instaMemo" placeholder="오늘 한마디"><button id="makeInsta">인스타 글 자동 만들기</button><textarea id="instaCaption"></textarea><div class="row"><button id="copyInsta">문구 복사</button><button id="shareInsta">📤 사진+문구 공유</button></div><div id="instaStatus" class="status">공유창에서 Instagram을 선택하세요.</div></div><div class="card"><h2>🔍 선생님 작품과 비교</h2><div class="row"><div style="flex:1"><div class="filePick"><label class="fileBtn" for="teacherPhoto">선생님 사진</label><button class="fileClear" data-clear="teacherPhoto">삭제</button><input id="teacherPhoto" type="file" accept="image/*"></div></div><div style="flex:1"><div class="filePick"><label class="fileBtn" for="myComparePhoto">내 사진</label><button class="fileClear" data-clear="myComparePhoto">삭제</button><input id="myComparePhoto" type="file" accept="image/*"></div></div></div><div class="compareGrid"><div class="compareBox"><span class="compareLabel">선생님 작품</span><img id="teacherImg" style="display:none"><span id="teacherEmpty">사진 등록</span></div><div class="compareBox"><span class="compareLabel">내 작품</span><img id="myCompareImg" style="display:none"><span id="myEmpty">사진 등록</span></div></div><textarea id="compareMemo" placeholder="비교 메모"></textarea></div></section><section id="training" class="page"><div class="card"><h2>🎓 서경대 입시 카운트다운</h2><input id="exam" type="date"><div id="dday" class="dday">시험일 입력</div><button id="saveExam">시험일 저장</button></div><div class="card"><h2>🎥 실전 연습모드</h2><div class="videoWrap"><video id="video" autoplay playsinline muted></video><div id="camPlaceholder">카메라 켜기를 누르면<br>내 모습이 여기에 표시됩니다.</div></div><div class="row" style="margin-top:8px"><button id="camOn">📷 카메라 켜기</button><button id="camOff" class="gray">카메라 끄기</button></div><div id="camStatus" class="status">카메라 대기 중</div><div id="timer" class="timer">00:00:00</div><div class="row"><button id="timerStart">▶ 시작</button><button id="timerPause" class="gray">⏸ 정지</button><button id="timerReset" class="gray">↺ 초기화</button></div><button id="applyTime" style="width:100%;margin-top:8px">측정시간을 오늘의 연습에 적용</button></div></section></div><nav class="bottom"><button data-go="home" class="active">🏠<br>홈</button><button data-go="practice">✂️<br>오늘연습</button><button data-go="portfolio">🖼️<br>포트폴리오</button><button data-go="instagram">📸<br>인스타</button><button data-go="training">🎥<br>연습</button></nav><script>(()=>{'use strict';const $=x=>document.getElementById(x);let images=[],stream=null,secs=0,timerId=null,instaFiles=[];function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));if(id==='portfolio')render();if(id!=='training')cameraOff();scrollTo(0,0)}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function records(){try{return JSON.parse(localStorage.getItem('beauty_records_v8')||'[]')}catch(e){return[]}}function previews(){$('preview').innerHTML='';images.forEach((src,i)=>{let w=document.createElement('div');w.className='previewItem';let im=new Image();im.src=src;let b=document.createElement('button');b.className='imgDelete';b.textContent='×';b.onclick=()=>{images.splice(i,1);previews()};w.append(im,b);$('preview').append(w)});$('photoCount').textContent=images.length+' / 6장'}$('photos').onchange=e=>{images=[];[...e.target.files].slice(0,6).forEach(f=>{let r=new FileReader();r.onload=()=>{images.push(r.result);previews()};r.readAsDataURL(f)})};$('savePractice').onclick=()=>{let a=records();a.push({id:Date.now(),date:new Date().toLocaleDateString('ko-KR'),type:$('type').value,time:+$('minutes').value||0,good:$('good').value,improve:$('improve').value,imgs:images});try{localStorage.setItem('beauty_records_v8',JSON.stringify(a));images=[];previews();go('portfolio')}catch(e){alert('사진 용량이 큽니다.')}};function render(){let a=records();$('works').innerHTML=a.length?'':'저장된 작품이 없습니다.';a.slice().reverse().forEach(x=>{let d=document.createElement('div');d.className='work';d.innerHTML='<b>'+x.type+'</b> · '+x.date+' · ⏱ '+x.time+'분';if(x.imgs?.[0]){let im=new Image();im.src=x.imgs[0];d.prepend(im)}$('works').append(d)})}function setD(v,out){if(!v){$(out).textContent='시험일 입력';return}let n=new Date();n.setHours(0,0,0,0);let d=Math.round((new Date(v+'T00:00:00')-n)/86400000);$(out).textContent=d>0?'D-'+d:d===0?'D-DAY':'D+'+Math.abs(d)}let ex=localStorage.getItem('beauty_exam_v8')||'';$('exam').value=$('homeExam').value=ex;setD(ex,'dday');setD(ex,'homeDday');$('homeExam').onchange=e=>setD(e.target.value,'homeDday');$('exam').onchange=e=>setD(e.target.value,'dday');function saveExam(v){if(!v)return alert('시험일을 입력해주세요.');localStorage.setItem('beauty_exam_v8',v);$('exam').value=$('homeExam').value=v;setD(v,'dday');setD(v,'homeDday')}$('homeSaveExam').onclick=()=>saveExam($('homeExam').value);$('saveExam').onclick=()=>saveExam($('exam').value);async function cameraOn(){if(!window.isSecureContext){$('camStatus').textContent='HTTPS 주소에서 열어주세요.';return}if(!navigator.mediaDevices?.getUserMedia){$('camStatus').textContent='이 브라우저는 카메라를 지원하지 않습니다.';return}try{cameraOff();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream;$('video').style.display='block';$('camPlaceholder').style.display='none';$('camStatus').textContent='● 카메라 작동 중'}catch(e){$('camStatus').textContent=e.name==='NotAllowedError'?'브라우저의 카메라 권한을 허용해주세요.':'카메라 오류: '+e.name}}function cameraOff(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('video').style.display='none';$('camPlaceholder').style.display='block'}$('camOn').onclick=cameraOn;$('camOff').onclick=cameraOff;function draw(){let h=String(Math.floor(secs/3600)).padStart(2,'0'),m=String(Math.floor(secs%3600/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');$('timer').textContent=h+':'+m+':'+s}$('timerStart').onclick=()=>{if(!timerId)timerId=setInterval(()=>{secs++;draw()},1000)};$('timerPause').onclick=()=>{clearInterval(timerId);timerId=null};$('timerReset').onclick=()=>{clearInterval(timerId);timerId=null;secs=0;draw()};$('applyTime').onclick=()=>{$('minutes').value=Math.max(1,Math.round(secs/60));go('practice')};function instaPreview(){$('instaPreview').innerHTML='';instaFiles.forEach(f=>{let im=new Image();im.src=URL.createObjectURL(f);$('instaPreview').append(im)});$('instaCount').textContent=instaFiles.length+' / 6장'}$('instaPhotos').onchange=e=>{instaFiles=[...e.target.files].slice(0,6);instaPreview()};$('makeInsta').onclick=()=>{$('instaCaption').value='오늘의 '+$('instaType').value+' 연습 ✂️\n\n'+($('instaMemo').value||'매일 조금씩 더 정확하고 완성도 있게 연습 중입니다.')+'\n\n#서경대입시 #미용입시 #헤어입시 #헤어연습 #미용포트폴리오 #BeautyLog'};$('copyInsta').onclick=async()=>{await navigator.clipboard.writeText($('instaCaption').value);$('instaStatus').textContent='문구를 복사했습니다.'};$('shareInsta').onclick=async()=>{try{let d={text:$('instaCaption').value};if(instaFiles.length&&navigator.canShare?.({files:instaFiles}))d.files=instaFiles;await navigator.share(d)}catch(e){}};function compare(id,img,empty,key){$(id).onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$(img).src=r.result;$(img).style.display='block';$(empty).style.display='none';try{localStorage.setItem(key,r.result)}catch(e){}};r.readAsDataURL(f)}}compare('teacherPhoto','teacherImg','teacherEmpty','beauty_teacher_ref');compare('myComparePhoto','myCompareImg','myEmpty','beauty_my_compare');document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{let id=b.dataset.clear;$(id).value='';if(id==='photos'){images=[];previews()}if(id==='instaPhotos'){instaFiles=[];instaPreview()}})})();</script></body></html>
